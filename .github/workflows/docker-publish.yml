name: Build and publish the MuckiSafe Docker image

# The image combines the muckidrive platform (github.com/muckiware/muckidrive)
# with the Muckiware facility and logging plugins into a ready-to-run backup
# server. This workflow checks out MuckiSafe (Dockerfile, entrypoint, compose),
# clones muckidrive into ./muckidrive as the application source and builds
# ghcr.io/muckiware/muckisafe.

on:
  push:
    branches: [main]
    tags: ['v*']
  # muckidrive-release: platform release, payload {muckidrive_ref}
  # muckidrive-core-release / muckidrive-master-release: package release,
  # payload {package, ref} - built from the latest muckidrive release tag
  repository_dispatch:
    types: [muckidrive-release, muckidrive-core-release, muckidrive-master-release]
  schedule:
    - cron: '0 3 * * 1'   # weekly: pick up muckidrive/platform updates
  workflow_dispatch:
    inputs:
      muckidrive_ref:
        description: 'muckidrive git ref to build from (branch or tag)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muckiware/muckisafe
  # Passed via env (not interpolated into the shell command) to avoid
  # command injection through the workflow_dispatch input.
  # Priority: muckidrive release event payload > manual dispatch input > main.
  # core/master release events override it with the latest muckidrive tag
  # (step "Resolve muckidrive ref").
  MUCKIDRIVE_REF: ${{ github.event.client_payload.muckidrive_ref || github.event.inputs.muckidrive_ref || 'main' }}

# core and master are often released together: queue the second build instead
# of running two image builds in parallel.
concurrency:
  group: muckisafe-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout MuckiSafe (build recipe)
        uses: actions/checkout@v4

      # The payload ref of a package release is a muckiware/core or
      # muckiware/master tag, not a muckidrive ref. Build from the latest
      # muckidrive release instead; composer resolves the new package version.
      - name: Resolve muckidrive ref (package release)
        if: github.event_name == 'repository_dispatch' && github.event.action != 'muckidrive-release'
        env:
          TRIGGER_PACKAGE: ${{ github.event.client_payload.package }}
          TRIGGER_REF: ${{ github.event.client_payload.ref }}
        run: |
          LATEST=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/muckiware/muckidrive.git 'v*' | head -n 1 | sed 's#.*refs/tags/##')
          if [ -z "$LATEST" ]; then
            echo "::error::No muckidrive release tag (v*) found."
            exit 1
          fi
          echo "Triggered by ${TRIGGER_PACKAGE} ${TRIGGER_REF} - building from muckidrive ${LATEST}."
          echo "MUCKIDRIVE_REF=${LATEST}" >> "$GITHUB_ENV"

      - name: Clone muckidrive platform (application source)
        run: git clone --depth 1 --branch "$MUCKIDRIVE_REF" https://github.com/muckiware/muckidrive.git muckidrive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep the stable "latest" tag under explicit release control.
          flavor: |
            latest=false
          tags: |
            # Stable release tags from SemVer Git tags (for example v0.0.2).
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # Traceable tags for every main, scheduled, manual and release build.
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-
          # Trace which muckidrive ref and which release event built the image.
          labels: |
            io.muckiware.muckidrive.ref=${{ env.MUCKIDRIVE_REF }}
            io.muckiware.trigger=${{ github.event.action || github.event_name }}
            io.muckiware.trigger.ref=${{ github.event.client_payload.ref || github.event.client_payload.muckidrive_ref || github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # CACHE_BUST: muckidrive has no composer.lock, so the composer
          # layer must be re-resolved on every run. Otherwise it is restored
          # from the GHA cache and a core/master/plugin release never reaches
          # the image. Layers before it (apt, PHP extensions, Node) stay cached.
          build-args: |
            MUCKIDRIVE_REF=${{ env.MUCKIDRIVE_REF }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max