name: Build and publish the MuckiSafe Docker image

# The image combines the muckidrive platform (github.com/muckiware/muckidrive)
# with the Muckiware facility and logging plugins into a ready-to-run backup
# server. This workflow checks out MuckiSafe (Dockerfile, entrypoint, compose),
# clones muckidrive into ./muckidrive as the application source and builds
# ghcr.io/muckiware/muckisafe.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'   # weekly: pick up muckidrive/platform updates
  workflow_dispatch:
    inputs:
      muckidrive_ref:
        description: 'muckidrive git ref to build from (branch or tag)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muckiware/muckisafe
  # Passed via env (not interpolated into the shell command) to avoid
  # command injection through the workflow_dispatch input.
  MUCKIDRIVE_REF: ${{ github.event.inputs.muckidrive_ref || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout MuckiSafe (build recipe)
        uses: actions/checkout@v4

      - name: Clone muckidrive platform (application source)
        run: git clone --depth 1 --branch "$MUCKIDRIVE_REF" https://github.com/muckiware/muckidrive.git muckidrive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep the stable "latest" tag under explicit release control.
          flavor: |
            latest=false
          tags: |
            # Stable release tags from SemVer Git tags (for example v0.0.2).
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # Traceable tags for every main, scheduled, manual and release build.
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            MUCKIDRIVE_REF=${{ env.MUCKIDRIVE_REF }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max