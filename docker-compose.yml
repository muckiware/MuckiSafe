# MuckiSafe — self-hosted backup & maintenance server
#
# Quick start:
#   curl -O https://raw.githubusercontent.com/muckiware/MuckiSafe/main/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/muckiware/MuckiSafe/main/.env.example
#   cp .env.example .env        # edit values!
#   docker compose up -d
#   -> http://localhost:8080/admin
#
# Build the image yourself instead of pulling:
#   git clone https://github.com/muckiware/muckidrive.git
#   cd muckidrive
#   docker build -f docker/Dockerfile -t muckisafe:local .

name: muckisafe

services:
  app:
    image: ghcr.io/muckiware/muckisafe:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      APP_ENV: prod
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      INSTANCE_ID: ${INSTANCE_ID}
      # SSH is disabled when this is empty. Put multiple keys on separate lines;
      # configure-ssh-keys.sh also accepts a literal backslash-n separator.
      SSH_PUBLIC_KEYS: ${SSH_PUBLIC_KEYS:-}
      # Apache unsets HOME; Composer needs HOME or COMPOSER_HOME.
      COMPOSER_HOME: /tmp/composer
      SHOPWARE_SKIP_WEBINSTALLER: "1"
      # No serverVersion parameter on purpose: it would pin Doctrine to the
      # wrong platform version string. Auto-detection (verified with MySQL 8.4)
      # picks the correct platform and keeps schema introspection working.
      DATABASE_URL: mysql://${DB_USER:-muckisafe}:${DB_PASSWORD}@db:3306/${DB_NAME:-muckisafe}
      MUCKIWARE_ROOT: /var/www/html
      MAILER_DSN: ${MAILER_DSN:-null://null}
      # MuckiFacilityPlugin: encryption key for repository passwords.
      # Generate:  openssl rand -hex 32
      # Without this value encrypted repository passwords cannot be read back!
      MUWA_FACILITY_SECRET: ${MUWA_FACILITY_SECRET}
      # First-boot admin account (created only on initial installation)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PROJECT_NAME: ${PROJECT_NAME:-MuckiSafe}
      PROJECT_EMAIL: ${PROJECT_EMAIL:-admin@example.com}
      PROJECT_LOCALE: ${PROJECT_LOCALE:-en-GB}
    volumes:
      - app-var:/var/www/html/var
      # Persist server host keys so SSH identity survives container recreation.
      - ssh-host-keys:/var/lib/muckisafe-ssh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /admin is the administration entry (SPA); /admin/login is NOT a route
      # on muckidrive (no storefront) and would 404 forever.
      test: ["CMD-SHELL", "curl -fsS http://localhost/admin || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  scheduler:
    # Supercronic runs the standard Shopware messenger worker and scheduled
    # tasks on configurable cron schedules. Both commands execute directly in
    # this container against the same database and shared var volume as app.
    image: ghcr.io/muckiware/muckisafe:latest
    restart: unless-stopped
    user: www-data
    environment:
      APP_ENV: prod
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      INSTANCE_ID: ${INSTANCE_ID}
      COMPOSER_HOME: /tmp/composer
      SHOPWARE_SKIP_WEBINSTALLER: "1"
      DATABASE_URL: mysql://${DB_USER:-muckisafe}:${DB_PASSWORD}@db:3306/${DB_NAME:-muckisafe}
      MUCKIWARE_ROOT: /var/www/html
      MUWA_FACILITY_SECRET: ${MUWA_FACILITY_SECRET}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      # Five-field cron expressions. Defaults: every five minutes.
      MESSENGER_CRON: "${MESSENGER_CRON:-*/5 * * * *}"
      SCHEDULED_TASK_CRON: "${SCHEDULED_TASK_CRON:-*/5 * * * *}"
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Berlin}
    volumes:
      - app-var:/var/www/html/var
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    # Skip app first-boot/Apache entrypoint and start Supercronic instead.
    entrypoint: ["/usr/local/bin/scheduler-entrypoint.sh"]

  db:
    # MySQL 8.4 — the database muckidrive is developed and tested against
    # (DDEV: mysql 8.4). Shopware-compatible settings from the DDEV config.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-muckisafe}
      MYSQL_USER: ${DB_USER:-muckisafe}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    command:
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --log_bin_trust_function_creators=1
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  app-var:
  ssh-host-keys:
  db-data: